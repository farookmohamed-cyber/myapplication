server.port=${PORT:8080}

# MySQL Datasource (values injected via environment variables)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/diagnostic_lab_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Application Configuration
lab.name=Vesper.ai Clinical Diagnostics Laboratory
lab.address=420 BioMed Parkway, Suite 300, Clinical Research District
lab.phone=+1 (800) 555-0194
lab.accreditation=ISO 15189:2022 Accredited Facility
lab.reports.dir=${REPORT_STORAGE_DIR:./reports}
lab.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Admin Auth Configuration
lab.admin.username=${APP_ADMIN_USERNAME:admin}
lab.admin.password=${APP_ADMIN_PASSWORD:VesperLab@2026}
